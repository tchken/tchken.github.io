<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Sea Level Rise — New York</title>
<script src="https://d3js.org/d3.v6.js"></script>
<script src="https://unpkg.com/d3-simple-slider"></script>

<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
<script src="https://api.mapbox.com/mapbox-gl-js/v1.12.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v1.12.0/mapbox-gl.css" rel="stylesheet" />

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Goldman&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="style.css">
<link rel="stylesheet" type="text/css" href="slider.css">
<style>
  #loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:5;
    background:rgba(12,44,32,0.9); color:#d6f5e3; padding:14px 22px; border-radius:8px; font-family:sans-serif; font-size:14px; }

  /* compact, legible control panel (overrides the chunky 180px/Goldman defaults) */
  #control_panel {
    width: min(56%, 560px) !important;
    height: auto !important;
    max-height: calc(100% - 16px) !important;
    overflow-y: auto !important;
    padding: 12px 16px !important;
    background: rgba(8, 30, 22, 0.92) !important;
    border-radius: 0 0 0 12px;
    font-size: 12px;
  }
  #control_panel, #control_panel * {
    font-family: 'Helvetica Neue', Arial, sans-serif !important;
  }
  #control_panel h1 { font-size: 0.95em !important; margin: 4px 0 !important; }
  #control_panel h2 { font-size: 0.76em !important; font-weight: 600 !important; margin: 7px 0 1px !important; line-height: 1.3 !important; }
  #control_panel h3 { font-size: 0.9em !important; margin: 5px 0 2px !important; }
  #control_panel p  { font-size: 0.75em !important; margin: 2px 0 !important; opacity: 0.8; }
  .chartButtons { margin: 8px 0 !important; padding: 0 !important; }
  .chartButtons button {
    font-size: 0.78em; padding: 5px 11px; margin: 0 6px 4px 0;
    border: 0; border-radius: 5px; background: #1e6b4a; color: #fff; cursor: pointer;
  }
  .chartButtons button.active { background: #2e8b57; }
  .seaSlider { width: 100%; }
  .slider { width: auto !important; }
  #pie svg { max-width: 100%; }
</style>
</head>
<body>

<div id="map" class="map"></div>
<div id="loading">Loading map &amp; flood overlays…</div>

<div id="control_panel" class="control_panel" style="display:none;">
  <h3>Location: <span id="current">New York</span></h3>
  <h2>Sea Level Rise: <span id="numMeters">0</span> Meters | <span id="numFeet">0</span> Feet</h2>
  <input id="sea_level" class="seaSlider" type="range" min="0" max="80" step="1" value="0" />

  <!-- Widget: Sea Level by Industry -->
  <h3 style="margin-top:14px;">Sea Level by Industry</h3>
  <div id="chart3">
    <div class="clearfix">
      <h3> Year: <span id="chart3yearsText">2018</span></h3>
      <input id="chart3years" class="seaSlider" type="range" min="2018" max="2500" step="1" value="2018">
      <div id="slider">
        <h1>Pollution by Industry Sector</h1>
        <p>Slide to remove an industry's emissions…</p>
      </div>
      <div id="pie"></div>
    </div>
  </div>
</div>

<script>
// ---- globals the widget scripts expect ----
var MASKS_LOADED = false;

// ---- client-side port of the Flask /predict regression (deterministic fit of slr_data.xlsx) ----
// CO2 emissions (gt) + target year -> global mean sea-level rise (meters), capped at 70 (all ice melted)
window.predictSeaLevel = function(years, gt){
  years = parseInt(years); if (isNaN(years)) years = 2018;
  gt = parseFloat(gt); if (isNaN(gt)) gt = 0;
  var m2 = 0.135172, b2 = -34.450947;   // co2_ppm -> sea level (cm)
  var m3 = 6.343881, b3 = 13.846959;    // emissions -> ppm increment
  var annual = 1.01610682, basePpm = 408.52, baseSl = 21.36;
  var ny = years - 2018;
  var ppm = basePpm + (m3 * gt + b3);
  var meters;
  if (ppm <= basePpm) meters = Math.ceil(0.001 * Math.pow(annual, ny));
  else meters = Math.ceil((m2 * ppm + b2 - baseSl) / 100 * Math.pow(annual, ny));
  if (!isFinite(meters) || meters < 0) meters = 0;
  if (meters > 70) meters = 70;
  return meters;
};

// ---- MAPBOX SETUP — Ken's own public token (free tier) ----
mapboxgl.accessToken = 'pk.eyJ1Ijoia2VuaGhoIiwiYSI6ImNrcTdpdGJ3eDAzc20zMHMxZThyeWp2NmkifQ.uCQz56AVhb99Lut1FaNfVw';
var map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/satellite-streets-v11',
  center: [-73.99, 40.74],
  zoom: 11.5,
  pitch: 45
});

// flood-mask placement over New York
var coordinates = [
  [-74.15, 40.90], [-73.66, 40.90], [-73.66, 40.65], [-74.15, 40.65],
];
var t_lng = 0.0830, t_lat = 0.1990;
coordinates[0][0] -= t_lng; coordinates[0][1] += t_lat;
coordinates[1][0] += t_lng; coordinates[1][1] += t_lat;
coordinates[2][0] += t_lng; coordinates[2][1] -= t_lat;
coordinates[3][0] -= t_lng; coordinates[3][1] -= t_lat;
for (var k = 0; k < 4; k++){ coordinates[k][0] -= 0.004; coordinates[k][1] -= 0.0001; }

var masks = [];
for (var i = 0; i < 80; i += 1){
  var istr = i.toString();
  masks.push({ source: "source_" + istr, id: "image_" + istr, url: "masks/ny_" + istr + ".png", coordinates: coordinates });
}

map.on('load', function () {
  for (var i = 0; i < masks.length; i++){
    var d = masks[i];
    map.addSource(d["source"], { "type": "image", "url": d["url"], "coordinates": d["coordinates"] });
    map.addLayer({ "id": d["id"], "source": d["source"], "type": "raster", "layout": { "visibility": "none" }, "paint": { "raster-opacity": 0.5 } });
  }
  MASKS_LOADED = true;

  // reveal the panel only once layers exist (avoids poking missing layers)
  document.getElementById('loading').style.display = 'none';
  document.getElementById('control_panel').style.display = '';

  var prev_idg = masks[0]["id"];
  document.getElementById('sea_level').addEventListener('input', function (e) {
    var meters = parseInt(e.target.value, 10);
    document.getElementById("numMeters").textContent = meters;
    document.getElementById("numFeet").textContent = (meters * 3.281).toFixed(1);
    if (meters > 0){
      if (meters % 10 == 0){ meters += 2; }
      meters -= 1;
      var idg = "image_" + meters.toString();
      map.setLayoutProperty(idg, 'visibility', 'visible');
      map.setLayoutProperty(prev_idg, 'visibility', 'none');
      prev_idg = idg;
    } else {
      map.setLayoutProperty(prev_idg, 'visibility', 'none');
    }
  });

  // terrain contours
  map.addSource('contours', { type: 'vector', url: 'mapbox://mapbox.mapbox-terrain-v2' });
  map.addLayer({ 'id': 'contours', 'type': 'line', 'source': 'contours', 'source-layer': 'contour',
    'layout': { 'visibility': 'visible', 'line-join': 'round', 'line-cap': 'round' },
    'paint': { 'line-color': '#877b59', 'line-width': 1 } });
});
</script>

<!-- widget logic (with /predict ported to window.predictSeaLevel) -->
<script src="js/chart3.js"></script>

</body>
</html>
