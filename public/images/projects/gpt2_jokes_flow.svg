<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14233d"/>
      <stop offset="55%" stop-color="#243b5e"/>
      <stop offset="100%" stop-color="#34528a"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- title -->
  <text x="44" y="44" fill="#dbe9ff" font-size="19" font-weight="700" letter-spacing="0.4">Humor Response Generation — GPT-2 served behind a REST API</text>
  <text x="44" y="66" fill="#8fb3e6" font-size="12.5" letter-spacing="0.3">condition on any prompt &#8594; sample a punchline</text>

  <!-- ===== LEFT: browser / web UI ===== -->
  <g filter="url(#soft)">
    <rect x="44" y="92" width="600" height="236" rx="12" fill="#f6f9ff"/>
    <!-- chrome bar -->
    <rect x="44" y="92" width="600" height="40" rx="12" fill="#0e1f3d"/>
    <rect x="44" y="116" width="600" height="16" fill="#0e1f3d"/>
    <circle cx="68" cy="112" r="5" fill="#ff5f56"/>
    <circle cx="86" cy="112" r="5" fill="#ffbd2e"/>
    <circle cx="104" cy="112" r="5" fill="#27c93f"/>
    <rect x="130" y="102" width="490" height="20" rx="10" fill="#1c3358"/>
    <text x="146" y="116" fill="#7fa6d6" font-size="11" font-family="monospace">jokebot.app  /  generate</text>

    <!-- form -->
    <text x="72" y="172" fill="#54637d" font-size="12" font-weight="700" letter-spacing="0.4">QUESTION / STATEMENT</text>
    <rect x="72" y="182" width="402" height="40" rx="8" fill="#fff" stroke="#cdd9ea" stroke-width="1.5"/>
    <text x="86" y="207" fill="#0e1f3d" font-size="13.5" font-family="monospace">What do you call the presidential toilet?</text>
    <rect x="486" y="182" width="86" height="40" rx="8" fill="url(#btn)"/>
    <text x="529" y="207" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Generate</text>

    <!-- output bubble -->
    <rect x="72" y="240" width="500" height="64" rx="8" fill="#e8f0fe" stroke="#cdd9ea" stroke-width="1"/>
    <text x="86" y="264" fill="#1e40af" font-size="11" font-weight="700" font-family="monospace">body:</text>
    <text x="86" y="288" fill="#0e1f3d" font-size="14">A dump.</text>
  </g>

  <!-- ===== RIGHT: REST API call ===== -->
  <g filter="url(#soft)">
    <rect x="676" y="92" width="480" height="236" rx="12" fill="#08152b"/>
    <rect x="676" y="92" width="480" height="34" rx="12" fill="#11233f"/>
    <rect x="676" y="110" width="480" height="16" fill="#11233f"/>
    <text x="696" y="114" fill="#7fa6d6" font-size="11" font-weight="700" letter-spacing="1">REST API</text>

    <text x="696" y="160" font-family="monospace" font-size="12.5">
      <tspan fill="#27c93f" font-weight="700">GET</tspan><tspan fill="#9cc0ef"> /generate_api</tspan>
    </text>
    <text x="696" y="180" font-family="monospace" font-size="12.5" fill="#6c86a8">  ?joke_title=presidential+toilet%3F</text>

    <line x1="696" y1="216" x2="1136" y2="216" stroke="#243a5a" stroke-width="1"/>

    <text x="696" y="244" font-family="monospace" font-size="12.5">
      <tspan fill="#5b6b7d">&#8592;</tspan><tspan fill="#27c93f" font-weight="700"> 200 OK</tspan><tspan fill="#6c86a8">  ·  GPT-2 (345M)</tspan>
    </text>
    <text x="696" y="282" font-family="monospace" font-size="13" fill="#dbe9ff">"title: presidential toilet?</text>
    <text x="696" y="304" font-family="monospace" font-size="13" fill="#f6c945"> body: A dump."</text>
  </g>
</svg>
